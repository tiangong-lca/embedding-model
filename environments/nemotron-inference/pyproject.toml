[project]
name = "lca-nemotron-inference"
version = "1.0.0"
description = "Isolated reproduction runtime for the published LCA Nemotron embedding model"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.11.0",
  "transformers==5.4.0",
  "sentence-transformers==5.3.0",
  "huggingface-hub==1.8.0",
  "safetensors==0.7.0",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu129" }
