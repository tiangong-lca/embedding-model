[project]
name = "lca-embedding"
version = "0.1.0"
description = "A pipeline for fine-tuning and evaluate embedding model in LCA Domain"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.14.0",
    "datasets>=5.0.1",
    "deepspeed>=0.19.6",
    "faiss-gpu-cu12>=1.14.1.post1",
    "flagembedding>=1.4.2",
    "gguf>=0.19.0",
    "loguru>=0.7.3",
    "matplotlib>=3.11.1",
    "modelscope>=1.39.1",
    "openai>=3.6.0",
    "peft==0.13.0",
    "python-dotenv>=1.2.3",
    "pytrec-eval>=0.5",
    "requests>=2.34.2",
    "sentence-transformers>=5.7.0,<6.0.0",
    "supabase>=2.31.0",
    "tidas-sdk==0.2.14",
    "torch==2.9.1",
    "transformers==4.51.3",
]

[tool.uv]
index-url = "https://mirrors.aliyun.com/pypi/simple"
