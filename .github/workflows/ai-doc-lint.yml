name: ai-doc-lint

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Base ref for the manual ai-doc comparison.
        required: false
        default: origin/main

permissions:
  contents: read

jobs:
  ai-doc-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch branches
        run: git fetch --force origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run local ai-doc lint gate
        env:
          BASE_REF: ${{ inputs.base_ref }}
        run: scripts/ai-doc-lint-gate.sh --base "$BASE_REF"
